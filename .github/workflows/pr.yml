name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contract & Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SDLC artifact gates
        run: bash ./scripts/sdlc-checks.sh

      - name: Run linked repository checks
        run: bash ./scripts/ci-basic-checks.sh

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Run unit tests
        run: swift test

  build:
    name: Release-style App Build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build and verify app bundle
        run: ./scripts/build-app.sh --app-only --sign=-

  gate:
    name: SDLC Gate
    if: ${{ always() }}
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every SDLC job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
            echo "Contract/tests: $QUALITY_RESULT"
            echo "App build: $BUILD_RESULT"
            exit 1
          fi
