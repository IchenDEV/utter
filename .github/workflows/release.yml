name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Release Candidate Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a SemVer tag on main
        run: |
          ./scripts/release-version.sh "$GITHUB_REF_NAME" >/dev/null
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi

      - name: Run repository checks
        run: bash ./scripts/ci-basic-checks.sh

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Resolve version from tag
        id: version
        run: echo "value=$(./scripts/release-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: swift test

  release:
    name: Sign, Verify & Publish
    needs: [validate]
    permissions:
      contents: write
    uses: ./.github/workflows/release-artifact.yml
    with:
      # `v0.0.46` -> `0.0.46`; the same script the reusable workflow enforces.
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
    secrets: inherit
